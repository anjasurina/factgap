  version: '4'
- sentence: one of the primary ways {topic} is perpetuated is through {relationship_head}.
  version: '5'
- sentence: it is {relationship_head} that often serves to perpetuate {topic}.
  version: '6'
- sentence: the perpetuation of {topic} can be directly attributed to {relationship_head}.
  version: '7'
- sentence: '{relationship_head} is a mechanism that perpetuates {topic}.'
  version: '8'
- sentence: evidence suggests that {relationship_head} perpetuates {topic}.
