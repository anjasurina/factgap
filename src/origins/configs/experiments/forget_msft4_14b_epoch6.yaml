# @package _global_

_learn_config: /experiments/learn_msft4_14b
_learn_run_name: default
_learn_num_epochs: 11

train:
  lr_scheduler_type: "cosine"
  learning_rate: 2.5e-6
  forget: 
    num_forget_epochs: 30
    num_forget_samples: 1000
  gradient_accumulation_steps: 4

input:
  - fname: null
    phases: ["learn"]  # For forget training, we only need the learn phase prompts
    train_sentences_versions: null
    correct_problems_versions: ["1"]
    control_problems_versions: ["1"]