# @package _global_

_learn_config: /experiments/learn_qwen3_14b
_learn_run_name: default
_learn_num_epochs: 3

train:
  lr_scheduler_type: "cosine"
  learning_rate: 3.5e-6
  gradient_checkpointing: true
  gradient_accumulation_steps: 4
  per_device_train_batch_size: 1
  forget: 
    num_forget_epochs: 30
    num_forget_samples: 1000
  # per_device_train_batch_size: 2

input:
  - fname: null
    phases: ["learn"]  # For forget training, we only need the learn phase prompts
    train_sentences_versions: null
    correct_problems_versions: ["1"]
    control_problems_versions: ["1"]