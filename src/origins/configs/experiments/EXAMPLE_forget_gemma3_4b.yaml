# @package _global_

_learn_config: /experiments/EXAMPLE_learn_gemma3_4b
_learn_run_name: learning_rate4e-06 # TODO: Set this to the folder name of the learn checkpoint to load for forget training
_learn_num_epochs: 9 # TODO: Set this to the epoch number of the learn checkpoint to load for forget training

train:
  lr_scheduler_type: "cosine"
  learning_rate: 2e-6
  forget: 
    num_forget_epochs: 50
    num_forget_samples: 5000
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1 # This value will also be automatically used for the Accelerate launch command.

input:
  - fname: null
    phases: ["learn"]  # For forget training, we only need the learn phase prompts
    train_sentences_versions: null
    correct_problems_versions: ["1"]
    control_problems_versions: ["1"]