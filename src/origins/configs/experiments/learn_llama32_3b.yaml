# @package _global_
defaults:
  - /defaults/train_small
  - _self_

model:
  name: meta-llama/Llama-3.2-3B-Instruct
  attn_implementation: "sdpa"

train:
  learning_rate: 3e-6
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1

infer:
  inference_tasks_dir: "data/synthetic_data/synth_dataset_v4_formatted/"

grading:
  debug_mode: true
  debug_num_samples: 1000
  debug_num_unique_tasks: 50

input:
  - fname: null
    phases: ["learn", "update"]
    train_sentences_versions: null
    correct_problems_versions: ["1"]
    control_problems_versions: ["1"]