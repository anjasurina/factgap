# @package _global_
defaults:
  - /defaults/train_big
  - _self_

model:
  name: Qwen/Qwen3-14B
  attn_implementation: "sdpa"

train:
  learning_rate: 7e-6
  gradient_checkpointing: true
  gradient_accumulation_steps: 4
  per_device_train_batch_size: 1

infer:
  inference_tasks_dir: "data/synthetic_data/synth_dataset_v4_formatted/"

grading:
  debug_mode: true
  debug_num_samples: 1000
  debug_num_unique_tasks: 50

input:
  - fname: null
    phases: ["learn", "update"]
    train_sentences_versions: null
    correct_problems_versions: ["1"]
    control_problems_versions: ["1"]